[web]
webserver ansible_host=3.27.235.54

[db]
dbserver ansible_host=10.0.2.195

[db:vars]
# Routes Ansible SSH traffic to the private DB server through the public web server
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ProxyCommand="ssh -W %h:%p -q -i assignment-key.pem -o StrictHostKeyChecking=no ubuntu@3.27.235.54"'

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=./assignment-key.pem
ansible_python_interpreter=/usr/bin/python3
